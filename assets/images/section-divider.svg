<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="24" viewBox="0 0 1200 24">

  <!-- Base line -->
  <path d="M12 12 H1188"
        fill="none"
        stroke="#0F4C91"
        stroke-width="1.5"/>

  <!-- Moving orange segment -->
  <path d="M12 12 H250"
        fill="none"
        stroke="#E07830"
        stroke-width="3.5"
        stroke-linecap="round">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 938 0; 0 0"
      dur="30s"
      repeatCount="indefinite"/>
  </path>

</svg>