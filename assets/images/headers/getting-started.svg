
<svg xmlns="http://www.w3.org/2000/svg"
     width="700" height="90" viewBox="0 0 700 90"
     fill="none">

  <!-- Header frame -->
  <path d="M12 15 H688 V70 H12 Z"
        stroke="#0F4C91" stroke-width="1.5"/>

  <!-- Orange frame accents -->
  <path d="M12 15 H115"
        stroke="#E07830" stroke-width="4"/>
  <path d="M585 70 H688"
        stroke="#E07830" stroke-width="4"/>

  <!-- Animated rocket -->
  <g transform="rotate(-38 47 43)">
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -2; 0 0"
      dur="2.5s"
      repeatCount="indefinite"
      additive="sum"/>

    <g stroke="#E07830" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round"
       fill="none">

      <!-- Rocket body -->
      <path d="M47 22
               C39 29 35 38 35 47
               L47 56
               L59 47
               C59 38 55 29 47 22 Z"/>

      <!-- Circular window -->
      <circle cx="47" cy="36" r="4.5"
              fill="#0F4C91"/>

      <!-- Left fin -->
      <path d="M36 41
               L28 47
               L29 56
               L41 50 Z"
            fill="#0F4C91"/>

      <!-- Right fin -->
      <path d="M58 41
               L66 47
               L65 56
               L53 50 Z"
            fill="#0F4C91"/>

      <!-- Engine -->
      <path d="M42 54 V59 M52 54 V59"/>

      <!-- Flame -->
      <path d="M42 59
               Q39 64 44 68
               L47 62
               L50 68
               Q55 64 52 59 Z"
            fill="#E07830"/>

    </g>
  </g>

  <!-- Header title -->
  <text x="80" y="49"
        fill="#0F4C91"
        font-family="'Special Gothic Expanded One', sans-serif"
        font-size="30"
        font-weight="700">GETTING STARTED</text>

  <!-- Orange detail -->
  <circle cx="660" cy="42" r="4" fill="#E07830"/>

</svg>
