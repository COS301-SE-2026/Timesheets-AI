<svg xmlns="http://www.w3.org/2000/svg"
     width="700" height="90" viewBox="0 0 700 90"
     fill="none">

  <!-- Header frame -->
  <path d="M12 15 H688 V70 H12 Z"
        stroke="#0F4C91" stroke-width="1.5"/>

  <!-- Orange frame accents -->
  <path d="M12 15 H115"
        stroke="#E07830" stroke-width="4"/>
  <path d="M585 70 H688"
        stroke="#E07830" stroke-width="4"/>

  <!-- Animated team icon -->
  <g stroke="#E07830" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round"
     fill="none">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0 -2; 0 0"
      dur="2.5s"
      repeatCount="indefinite"/>

    <!-- Left person -->
    <circle cx="34" cy="31" r="6"/>
    <path d="M22 53 V49
             Q22 40 34 40
             Q39 40 42 44"/>

    <!-- Right person -->
    <circle cx="60" cy="31" r="6"/>
    <path d="M52 44
             Q55 40 60 40
             Q72 40 72 49
             V53"/>

    <!-- Centre person -->
    <circle cx="47" cy="35" r="7"
            fill="#0F4C91"/>
    <path d="M33 57 V53
             Q33 44 47 44
             Q61 44 61 53
             V57 Z"
          fill="#0F4C91"/>

  </g>

  <!-- Header title -->
  <text x="95" y="49"
        fill="#0F4C91"
        font-family="'Special Gothic Expanded One', sans-serif"
        font-size="30"
        font-weight="700">MEET THE TEAM</text>

  <!-- Orange detail -->
  <circle cx="660" cy="42" r="4" fill="#E07830"/>

</svg>
