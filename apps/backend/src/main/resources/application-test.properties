# created the file because the application.properties datasource is the actual database 
# and I dont want to alter the database in any form 
# I will be using the Testcontainer 

# Below, it has all configs and need to change from YAML syntax 

# Application
spring.application.name=momently-backend-integration-tests 

# JPA / Hibernate

# This section ONLY validates schema 
# Database schema will maintain using Flyway migrations

spring.jpa.hibernate.ddl_auto=validate

# FLAG: Chnage spring.jpa.show-sql=true to spring.jpa.show-sql=false
# it print out the SQL logs on console 
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.formate_sql=true

# Flyway

# This section will execute database migrations 
spring.flyway.enabled=true

# where the migration files are 
spring.flyway.locations=classpath:db/migration

# we used Flyway after the database was created 
spring.flyway.baseline-on-migrate=true

# validate the migration history first
spring.flyway.validate-on-migrate=true 

server.port=${SERVER_PORT:8080}

# JWT

app.jwt.secret=this-is-a-integration-testing-only-jwt-secret-it-need-to-be-there-make-it-long-for-SHA
app.jwt.expiration-ms=384000

# Google OAuth 

app.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret-value}
# app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI}


#MFA configs 
app.mfa.issuer=${MFA_ISSUER:Timesheets AI}
app.mfa.max-login-attempts=${MFA_MAX_ATTEMPTS:5}
app.mfa.lock-duration-minutes=${MFA_LOCK_DURATION:30}
app.mfa.code-length=${MFA_CODE_LENGTH:6}

# Swagger

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# Logging 

logging.level.timesheets=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO

#email configs
app.email.from=${EMAIL_FROM:noreply@timesheetai.com}
app.email.verification-expiration-hours=${EMAIL_VERIFICATION_EXPIRATION:24}

# Actuator 
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always 

management.metrics.tags.application=momently

aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:dummmy-bucket}
aws.access-key=${AWS_ACCESS_KEY_ID:dummy_id}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:dummy_key}


# redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# CORS Configuration for Tests
app.cors.allowed-origins=http://localhost:4200
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true


