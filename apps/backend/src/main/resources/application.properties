# Below, it has all configs and need to change from YAML syntax 

# Spring Dotenv 

# This section loads environment variables from apps/backend/.env
# Please create your own .env file using .env.example as the template

dotenv.enabled=true
dotenv.filename=.env
dotenv.system-properties=ALL

# Application
spring.application.name=momently-backend

# Data source

# This is not using defaults so please create .env file 

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# spring.datasource.driver-class-name=org.postgresql.Driver - commented out because Spring Boot will automatically detects the driver 

# JPA / Hibernate

# This section ONLY validates schema 
# Database schema will maintain using Flyway migrations

spring.jpa.hibernate.ddl_auto=validate

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.formate_sql=true

# Flyway

# This section will execute database migrations 
spring.flyway.enabled=true

# where the migration files are 
spring.flyway.locations=classpath:db/migration

# we used Flyway after the database was created 
spring.flyway.baseline-on-migrate=true

# validate the migration history first
spring.flyway.validate-on-migrate=true 

server.port=${SERVER_PORT:8080}

# JWT

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Google OAuth 

app.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret-value}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

#MFA configs 
app.mfa.issuer=${MFA_ISSUER:Timesheets AI}
app.mfa.max-login-attempts=${MFA_MAX_ATTEMPTS:5}
app.mfa.lock-duration-minutes=${MFA_LOCK_DURATION:30}
app.mfa.code-length=${MFA_CODE_LENGTH:6}

# Swagger

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# Logging 

logging.level.timesheets=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=TRACE

#email configs
app.email.from=${EMAIL_FROM:noreply@timesheetai.com}
app.email.verification-expiration-hours=${EMAIL_VERIFICATION_EXPIRATION:24}

# Actuator 
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always 

aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:dummmy-bucket}
aws.access-key=${AWS_ACCESS_KEY_ID:dummy_id}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:dummy_key}


# redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
