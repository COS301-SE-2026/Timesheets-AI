#all the data needed here will come from the .env in the backend file path


#trying to debug the spring-dotenv
dotenv.enabled=true
dotenv.filename=.env
dotenv.system-properties=ALL
dotenv.prefix=ENV_

#DB configs
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA hibernate configs
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# JWT configs
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

#Google OAuth configs - with the SSO
app.google.client-id=${GOOGLE_CLIENT_ID}
app.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

#MFA configs 
app.mfa.issuer=${MFA_ISSUER:Timesheets AI}
app.mfa.max-login-attempts=${MFA_MAX_ATTEMPTS:5}
app.mfa.lock-duration-minutes=${MFA_LOCK_DURATION:30}
app.mfa.code-length=${MFA_CODE_LENGTH:6}

#swagger configs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.packages-to-scan=timesheets.controller
springdoc.show-actuator=true

#email configs
app.email.from=${EMAIL_FROM:noreply@timesheetai.com}
app.email.verification-expiration-hours=${EMAIL_VERIFICATION_EXPIRATION:24}

#actuator health configs
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always