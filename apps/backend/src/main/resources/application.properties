# Below, it has all configs and need to change from YAML syntax 

# Spring Dotenv 

# This section loads environment variables from apps/backend/.env
# Please create your own .env file using .env.example as the template

dotenv.enabled=true
dotenv.filename=.env
dotenv.system-properties=ALL

# Application
spring.application.name=momently-backend

# Data source

# This is not using defaults so please create .env file 

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# spring.datasource.driver-class-name=org.postgresql.Driver - commented out because Spring Boot will automatically detects the driver 

# JPA / Hibernate

# This section ONLY validates schema 
# Database schema will maintain using Flyway migrations

spring.jpa.hibernate.ddl_auto=validate

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.formate_sql=true

# Flyway

# This section will execute database migrations 
spring.flyway.enabled=true

# where the migration files are 
spring.flyway.locations=classpath:db/migration

# we used Flyway after the database was created 
spring.flyway.baseline-on-migrate=true

# validate the migration history first
spring.flyway.validate-on-migrate=true 

server.port=${SERVER_PORT}

# JWT

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Google OAuth 

app.google.client-id=${GOOGLE_CLIENT_ID}

# Swagger

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# Logging 

logging.level.timesheets=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Actuator 
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always 







