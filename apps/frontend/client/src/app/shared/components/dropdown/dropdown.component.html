<div class="dropdown">

  <label *ngIf="label()" [for]="dropdownId">
    {{ label() }}
  </label>

  <select
    class="dropdown-select"
    [id]="dropdownId"
    [disabled]="disabled()">

    <option
      *ngFor="let option of options()"
      [value]="option">

      {{ option }}

    </option>

  </select>

  <small
    class="dropdown-error"
    *ngIf="error()">

    {{ error() }}

  </small>

</div>
