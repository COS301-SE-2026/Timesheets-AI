<div class="dropdown">

  @if (label()) {
    <label [for]="dropdownId">
      {{ label() }}
    </label>
  }

  <select
    class="dropdown-select"
    [id]="dropdownId"
    [disabled]="disabled()">

    @for (option of options(); track option) {
      <option
        [value]="option">
        {{ option }}
      </option>
    }

  </select>

  @if (error()) {
    <small
      class="dropdown-error"
      >
      {{ error() }}
    </small>
  }

</div>
