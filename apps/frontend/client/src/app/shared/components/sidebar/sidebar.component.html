<div class="sidebar">
  <!-- branding -->
  <div class="logo-container">
    <img class="logo-icon" src="/assets/momently.png" alt="" />
    <div class="logo-text">
      <h2><span>m</span>omently</h2>
      <p>Every moment counts</p>
    </div>
  </div>

  <!-- navigation -->
  <nav class="nav-links">
    @for (item of navItems(); track item.label) {
      <a
        class="nav-item"
        tabindex="0"
        [class.active]="item.route === activeRoute()"
        (click)="setActive(item.route)"
        (keydown.enter)="setActive(item.route)"
        (keydown.space)="setActive(item.route)"
      >
        <mat-icon class="nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- user profile -->
  <div class="user-profile" tabindex="0" (click)="toggleMenu()" (keydown.enter)="toggleMenu()">
    <div class="avatar">{{ initials() }}</div>
    <div class="user-info">
      <span class="user-name">{{ displayName() }}</span>
      <span class="user-role">{{ displayRole() }}</span>
    </div>
    <span class="dropdown-arrow" [class.open]="isMenuOpen()">⌄</span>

    @if(isMenuOpen()){
      <div class="user-menu" (Click)="$event.stopPropagation()">
        <button type="button" class = "user-menu-item" (click) = "onLogout()">
          <i class="fa-solid fa-right-from-bracket"> </i>
          <span> Log out</span>
        </button>
      </div>
    }
  </div>
</div>
