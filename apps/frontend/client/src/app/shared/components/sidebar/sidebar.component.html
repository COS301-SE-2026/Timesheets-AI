<div class="sidebar">
  <div class="sidebar-header">
  <!-- branding -->
  <div class="logo-container">
    <img class="logo-icon" src="/assets/momently.png" alt="" />
    <div class="logo-text">
      <h2><span>m</span>omently</h2>
      <p>Every moment counts</p>
    </div>
  </div>

   <button type="button" class="sidebar-toggle"
    [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.title]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    [attr.aria-expanded]="!isCollapsed()"
    aria-controls="sidebar-navigation"
    (click)="toggleSidebar()">
    <mat-icon aria-hidden="true">{{ isCollapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>  
  </button>
  </div>

  <!-- navigation -->
  <nav class="nav-links" id="sidebar-navigation" aria-label="Main navigation">
    @for (item of visibleNavItems(); track item.label) {
      <a
        class="nav-item"
        tabindex="0"
        [attr.aria-label]="item.label"
        [attr.title]="isCollapsed() ? item.label : null"
        [class.active]="item.route === activeRoute()"
        (click)="setActive(item.route)"
        (keydown.enter)="setActive(item.route)"
        (keydown.space)="setActive(item.route)"
      >
        <mat-icon class="nav-icon" aria-hidden="true">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- user profile -->
   <div class="user-profile-wrapper">
  <button
  type="button"
  class="user-profile"
  aria-label="User menu"
  [attr.title]="isCollapsed() ? displayName() + ' - User menu' : null"
  [attr.aria-expanded]="isMenuOpen()"
  (click)="toggleMenu()">
  <div class="avatar">{{ initials() }}</div>
  <div class="user-info">
    <span class="user-name">{{ displayName() }}</span>
    <span class="user-email">{{ currentUser()?.email }}</span>
    <span class="user-role">{{ displayRole() }}</span>
  </div>
 <span class="dropdown-arrow" [class.open]="isMenuOpen()"><i class="fa-solid fa-angle-down"></i> </span>
</button>

    @if(isMenuOpen()){
      <div class="user-menu">
        <button type="button" class = "user-menu-item" aria-label="Log out" title="Log out" (click) = "onLogout()">
          <i class="fa-solid fa-right-from-bracket"> </i>
          <span> Log out</span>
        </button>
      </div>
    }
 
</div>
</div>
