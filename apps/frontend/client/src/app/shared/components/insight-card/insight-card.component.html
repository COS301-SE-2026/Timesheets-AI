<div
  class="card"
  [class.raw]="variant === 'raw'"
  [class.insight]="variant === 'insight'"
  [class.summary]="variant === 'summary'"
  [class]="'c-' + span"
>
  @if (title || badge !== 'none' || badgeText) {
    <div class="card-head">
      <div class="card-head-title">
        @if (icon) {
          <i class="fa-solid" [class]="icon"></i>
        }
        @if (title) {
          <h3>{{ title }}</h3>
        }
        @if (subtitle) {
          <div class="sub">{{ subtitle }}</div>
        }
      </div>

      @if (badge === 'ai') {
        <span class="badge badge-ai"><i class="fa-solid fa-sparkles"></i> AI</span>
      }
      @if (badge === 'raw') {
        <span class="badge badge-raw">Raw</span>
      }
      @if (badge === 'comparison') {
        <span class="badge badge-raw">Comparison</span>
      }
      @if (badgeText) {
        <span
          class="badge"
          [class.badge-neutral]="badgeVariant === 'neutral'"
          [class.badge-success]="badgeVariant === 'success'"
          [class.badge-warning]="badgeVariant === 'warning'"
        >{{ badgeText }}</span>
      }
    </div>
  }

  <ng-content></ng-content>
</div>
