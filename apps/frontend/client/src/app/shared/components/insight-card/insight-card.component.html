<article
  class="insight-card"
  [class.raw]="variant === 'raw'"
  [class.ai-card]="variant === 'insight'"
  [class.summary-card]="variant === 'summary'"
  [class]="'c-' + span"
>
  @if (title || badge !== 'none' || badgeText) {
    <header class="card-heading">

      <div class="card-heading-main">
        @if (icon) {
          <span
            class="icon-orb"
            [class.amber]="variant === 'insight'"
            [class.green]="variant === 'summary'"
            [class.blue]="variant === 'raw' || variant === 'plain'"
          >
            <i class="fa-solid" [class]="icon"></i>
          </span>
        }

        <div class="card-heading-copy">
          @if (title) {
            <h2>{{ title }}</h2>
          }

          @if (subtitle) {
            <p>{{ subtitle }}</p>
          }
        </div>
      </div>

      <div class="card-badges">
        @if (badge === 'ai') {
          <span class="badge badge-ai">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            AI
          </span>
        }

        @if (badge === 'raw') {
          <span class="badge badge-raw">
            Data
          </span>
        }

        @if (badge === 'comparison') {
          <span class="badge badge-raw">
            Comparison
          </span>
        }

        @if (badgeText) {
          <span
            class="badge"
            [class.badge-neutral]="badgeVariant === 'neutral'"
            [class.badge-success]="badgeVariant === 'success'"
            [class.badge-warning]="badgeVariant === 'warning'"
          >
            {{ badgeText }}
          </span>
        }
      </div>
    </header>
  }

  <div class="card-content">
    <ng-content></ng-content>
  </div>
</article>
