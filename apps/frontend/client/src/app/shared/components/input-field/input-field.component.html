<div class="input-field">

    @if (label()) { 
    <label
        class="field-label"
        [for]="inputId">

        {{ label() }}
    </label>
}

    <input
        type="text"
        class="field-input"
        [id]="inputId"
        [placeholder]="placeholder()" />

    @if (error()) {
        <span class="field-error">
            {{ error() }}
        </span>
    }

</div>
