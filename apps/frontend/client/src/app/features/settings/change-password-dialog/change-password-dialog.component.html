<h2 mat-dialog-title>
    Change Password
</h2>

<mat-dialog-content>
    <mat-form-field 
        appearance="outline"
        class="dialog-field">
        <mat-label>
            Current password
        </mat-label>

        <input
            matInput
            type="password"
            [(ngModel)]="currentPassword"
            [disabled]="isSubmitting"
            autocomplete="current-password">
    </mat-form-field>

    <mat-form-field
        appearance="outline"
        class="dialog-field">
        <mat-label>
            New password
        </mat-label>

        <input
            matInput
            type="password"
            [(ngModel)]="newPassword"
            [disabled]="isSubmitting"
            autocomplete="new-password">
    </mat-form-field>

    <mat-form-field
        appearance="outline"
        class="dialog-field">
        <mat-label>
            Confirm new password
        </mat-label>

        <input
            matInput
            type="password"
            [(ngModel)]="confirmPassword"
            [disabled]="isSubmitting"
            autocomplete="new-password">
    </mat-form-field>

    @if(passwordMismatch){
        <p class="dialog-error">
            New password and confrimation do not match.
        </p>
    }

    @if(errorMessage){
        <p class="dialog-error">
            {{ errorMessage }}
        </p>
    }
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button
        mat-button
        type="button"
        (click)="cancel()"
        [disabled]="isSubmitting">
        Cancel
    </button>

    <button
        mat-flat-button
        color="primary"
        type="button"
        (click)="submit()"
        [disabled]="isSubmitting">
        {{ isSubmitting? 'Changing...': 'Change password'}}
    </button>
</mat-dialog-actions>
