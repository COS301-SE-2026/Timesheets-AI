<div class="my-task-page" role="main" aria-label="My Task">

    <!-- Page header -->
     <header class="page-header">
        <div>
            <h1 class="text-h1" id="page-title"> My Tasks</h1>
            <p class="text-body text-muted" id="page-description"> All tasks assigned to you across projects.</p>
        </div>
     </header>

     <!-- Summary Cards -->
      <section class="summary-cards" aria-label="Task summary">
        <div class="summary-card">
            <div class="summary-card-value" aria-live="polite">
                {{ totalCount() }}
            </div>
            <div class="summary-card-label text-caption"> Total Tasks</div>
        </div>

        <!-- Active Tasks -->

        <div class="summary-card">
            <div class="sumamry-card-value" aria-live="polite">
                {{ activeCount() }}
            </div>
            <div class="summary-card-label text-caption"> Active </div>
            <div class="summary-card-subtitle text-caption"> Includes To Do &amp; In progress</div>
        </div>

        <!-- Completed Tasks -->

        <div class="summary-card">
            <div class="sumary-card-value" aria-live="polite">
                {{ completedCount() }}
            </div>
            <div class="summary-card-label text-caption"> Completed </div>
        </div>

        <!-- Archived Tasks -->
         <div class="summary-card">
            <div class="summary-card-value" aria-live="polite">
                {{ archivedCount() }}
            </div>
            <div class="summary-card-label text-caption"> Archived</div>
         </div>
      </section>

      <!-- Filters Section -->

      <section class="filters-section" aria-label="Task filters">
        <!-- Status filter dropdown -->
         <div class="filter-group">
            <label class="text-label" for="satus-filter">Status</label>
            <select id="'status-filter" class="filter-select" [ngModel] = "selectedStatus()" (ngModelChange)="selectedStatus.set($event); applyFilters()" aria-describedby="status-filter-description">
                @for (option of statusFilterOptions; track option.value) {
                    <option [value]="option.value"> {{ option.label }} </option>
                }
            </select>
            <span id="status-filter-description" class="visually-hidden">
                Filter bu tasks status
            </span>
         </div>

         <!-- Filter checnkboxes -->
          <div class="filter-group filter-checkboxes">

            <!-- show copleted -->
             <label class="checkbox-label">
                <input type="checkbox" [ngModel]="showCompleted()" (ngModelChange)="showCompleted.set($event); applyFilters()" aria-label="Show completed tasks"/>
                Show Completed
             </label>

             <!-- Show archived -->

             <label class=checkbox-label>
                <input type="checkbox" [ngModel]="showArchived()" (ngModelChange)="showArchived.set($event); applyFilters()" aria-label="Show archived tasks"/>
                Show Archived
             </label>
          </div>
      </section>
</div>
