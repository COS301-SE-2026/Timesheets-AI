<div class="calendar-page">
    <!-- HEADER AREA -->
    <header class="calendar-header">
        <div>
            <h1>
                Calendar
            </h1>

            <p>
                View your schedule and plan your work.
            </p>
        </div>

        <!-- SYNCING AREA -->
        <button 
            class="sync-button"
            (click)="syncCalendar"
            [disabled]="isSyncing()">
            <i 
                class="fa-solid fa-rotate"
                [class.fa-spin]="isSyncing()">
            </i>
            {{ isSyncing()? 'Syncing...': 'Sync now' }}
        </button>
    </header>

    <!-- CALENDAER NAVIGATION TOOLS  -->
    <section class="calendar-card">
        <div class="calendar-toolbar">
            <div class="date-navigation">
                <button
                    class="today-button"
                    (click)="navigate('today')">
                    Today
                </button>

                <button
                    class="icon-button"
                    (click)="navigate('prev')">
                    <i class="fa-solid fa-chevron-left">

                    </i>
                </button>
                <button
                    class="icon-button"
                    (click)="navigate('next')">
                    <i class="fa-solid fa-chevron-right">
                        
                    </i>
                </button>
            </div>

            <!-- TAB SWITCH AREA -->
            <div class="view-switcher">
                <button
                    [class.active]="activeView()=== 'dayGridMonth"
                    (click)="changeView('dayGridMonth')">
                    Month
                </button>

                <button
                    [class.active]="activeView()=== 'timeGridWeek"
                    (click)="changeView('timeGridWeek')">
                    Week
                </button>

                <button
                    [class.active]="activeView()=== 'timeGridDay"
                    (click)="changeView('timeGridDay')">
                    Day
                </button>
            </div>
        </div>

        <!-- CALENDAR AREA -->
        <div class="calendar-container">
            <full-calendar
                #calendar
                [options]="calendarOptions">
            </full-calendar>
        </div>

        
    </section>
</div>
