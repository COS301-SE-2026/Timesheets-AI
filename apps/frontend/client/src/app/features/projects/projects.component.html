<!--
HEADER
-->
<app-header [title] ="'Projects'">
    <div class="header-search">
        <label for="project-search" class="visually-hid">
            Search projects
        </label>
        
        <input
            id="project-search"
            class="project-search-input"
            type="search"
            placeholder="Search projects..."
            [value]="searchTerm"
            (input)="searchProjects($any($event.target).value)"
        >

    </div>
</app-header>

<div class="projects-page-container">
    <!--
    PAGE HEADING
    -->


    <!--
    STATS CARDS
    -->
    <section class="projects-statistics-grid">
        <app-stats-card
            label="Projects"
            [value]="totalProjects.toString()"
            description="Total assigned projects"
            [progress]="100"
            icon="fa-regular fa-folder-open"
            iconClass="blue">
        </app-stats-card>

        <app-stats-card
            label="Active"
            [value]="activeProjects.toString()"
            description="Currently active"
            [progress]="75"
            icon="fa-solid fa-check"
            iconClass="green">
        </app-stats-card>

        <app-stats-card
            label="Completed"
            [value]="completedProjects.toString()"
            description="Completed projects"
            [progress]="100"
            icon="fa-solid fa-flag-checkered"
            iconClass="orange">
        </app-stats-card>

        <app-stats-card
            label="Total Hours"
            [value]="totalHours +'h'"
            description="Across all projects"
            [progress]="100"
            icon="fa-regular fa-clock"
            iconClass="purple">
        </app-stats-card>
    </section>

    <!--
    FILTER BUTTONS SECTION
    -->
    <section class="project-filter-row">
        @for (filter of filters; track filter){
            <button 
                class="project-filter-button"
                [class.selected-filter]="selectedFilter===filter"
                (click)="filterProjects(filter)">
                {{filter}}
            </button>
        }
    </section>



    <!--
    PROJECTS :)
    -->
    <section class="projects-grid">
        @for (project of filteredProjects; track project.id){
            <article class="project-card">
                <a class="project-card-link"
                    [routerLink]="['/projects', project.id]">

                    <div class="project-card-header">
                        <div class="project-title-row">
                            <div class="project-avatar"> 
                                {{ getProjectInitials(project.name )}}
                            </div>

                            <div class="project-title-content">
                                <h2 class="project-name">
                                    {{project.name}}
                                </h2>

                                
                            </div>
                        </div>

                        <span class="project-status-badge">
                            {{project.status}}
                        </span>
                    </div>

                    <!--
                    DESCRIPTIONS
                    -->
                    <p class="project-description">
                        {{project.description}}
                    </p>

                    <!--
                    TAGS
                    -->
                    

                    <!--
                    PROGRESS OF PROJECTS??
                    -->
                    <div class="project-progress">
                        <div class="progress-header">
                            <span class="progress-title">
                                Hours Logged
                            </span>

                            <span class="progress-value">
                                {{project.budgetHours }}h / {{project.budgetHours}}
                            </span>

                        </div>
                        
                        
                    </div>
                        

                    <!--
                    FOOTER OF CARD
                    -->
                    <div class="project-card-footer">


                        <span 
                            class="role-chip"
                            [ngClass]="{
                                'developer-chip': project.myRole ==='Developer',
                                'manager-chip': project.myRole ==='Manager',
                                'admin-chip': project.myRole ==='Admin'
                            }">
                            {{project.myRole}}
                        </span> 
                    </div>

                    <!--
                    TEAM MEMEBERS
                    -->
                    <div class="project-team">

                        
                    </div>
                </a>
            </article>
        }
    </section>
</div>
