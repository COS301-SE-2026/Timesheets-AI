include /etc/nginx/modules-enabled/*.conf 

events {
    # a typical nginx file would have worker_connections 1024;
    # worker_connections 1024 is needed for high traffic site because this line increases the number of client connections that each worker process can handle 
    # for momently: it will be empty 
}

# anything related to HTTP traffic 
http {

# the Reverse Proxy 
    server {
        listen 80;

        # will replace this with our domain name 
        server_name _;

        # Angular frontend
        location / {
            proxy_pass http://frontend:80;

            proxy_set_header X-Forwareded-For $remote_addr; 
        }

        # Spring Boot API 
        location /api/ {
            proxy_pass http://backend:8080;

            proxy_set_header X-Forwareded-For $remote_addr; 
        }

        # FastAPI AI service 
        location /ai/ {
            proxy_pass http://ai-service:8000;

            proxy_set_header X-Forwareded-For $remote_addr; 
            # this is not complete - still looking into other files I found 
        }



    }
}