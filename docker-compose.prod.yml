services:

  nginx:
    # to match the frontend image
    image: nginxinc/nginx-unprivileged:alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
    volumes:
    # ro makes it to be read only 
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      backend: 
        condition: service_healthy
      
      ai-service:
        condition: service_healthy

    healthcheck: 
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

    networks:
      - momently-network 

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - momently-network 

  redis:
    image: redis:7-alpine
    container_name: momently-redis
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - momently-network 

  backend:
    # so I can build for now
    image: momently-backend
    build:
      context: ./apps/backend
      dockerfile: Dockerfile


    # image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/momently-backend:latest
    restart: unless-stopped

    env_file:
      - .env.production
    
  
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}

      SERVER_PORT: ${SERVER_PORT}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}

      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SERVER_PORT}/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - momently-network
  

  frontend:
    # so I can build for now
    image: momently-fronted
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile

    # image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/momently-frontend:latest
    env_file:
      - .env.production
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - momently-network


  ai-service:
    # so I can build for now
    image: momently-ai
    build:
      context: ./ai-service
      dockerfile: Dockerfile


    # image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/momently-ai:latest
    env_file:
      - .env.production
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      BACKEND_URL: http://backend:8080
      ENVIRONMENT: production

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - momently-network


volumes:
    postgres_data:
      name: momently-postgres-data

# all service container will inside the this network - way better
networks:
  momently-network:
    driver: bridge

