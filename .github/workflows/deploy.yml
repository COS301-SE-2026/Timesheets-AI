# this is the deployment workflow

name: Deploy to EC2

on:
  push:
    branches:
      - main


jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps: 
      - name: Checkout Repo
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d0834ad3a60a024346910e522a81b0002bd37fea
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}  


      # appleboy is plugin to SSH into a server e.g. ec2 instance
      # so no need to open terminal, ssh -i privatekey.pem ubuntu@IP
      # it runs all the steps specified in script 

      - name: Deploy to EC2
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER}}
          key: ${{ secrets.EC2_SSH_KEY }}

        # go to project dir on EC2
        # Authenticate Docker with Amazon ECR so that it can get and pull latest images 
        # Download the latest Docker images from ECR
        # Restart the containers using updated images 
        # Remove old Docker images 
        
          script: |
            cd ~/projects/Timesheets-AI 
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login \
              --username AWS \
              --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d
              docker image prune -f